<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--ink:#16241f;--paper:#f2f5f1;--panel:#fff;--line:#dce3dd;--in:#0f766e;--out:#be123c;--muted:#5f6f68}
[data-bs-theme=dark]{--ink:#e7efea;--paper:#101715;--panel:#18211e;--line:#2a3833;--in:#2dd4bf;--out:#fb7185;--muted:#9fb0a8}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.25rem}
.muted{color:var(--muted)}
.balance{font-size:clamp(2.6rem,9vw,4.4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.in{color:var(--in)}.out{color:var(--out)}
.form-control,.form-select{background-color:var(--panel);color:var(--ink);border-color:var(--line)}
.btn-main{background:var(--ink);color:var(--paper);border:0;font-weight:700}
.btn-main:hover{background:var(--in);color:#fff}
.tx{display:flex;align-items:center;gap:.9rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.bar{width:4px;align-self:stretch;border-radius:2px}
.bar.income{background:var(--in)}.bar.expense{background:var(--out)}
.tx .info{flex:1;min-width:0}
.tx .info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-box{position:relative;height:280px}
.empty{padding:2rem 0;text-align:center}
:focus-visible{outline:3px solid var(--in);outline-offset:2px}
</style>
</head>
<body>
<div class="container py-4" style="max-width:1080px">

  <header class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 fw-bold m-0">Expense Tracker</h1>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary" id="exportBtn">Export CSV</button>
      <button class="btn btn-sm btn-outline-secondary" id="themeBtn" aria-label="Toggle dark mode">Dark mode</button>
    </div>
  </header>

  <section class="row g-3 mb-3 align-items-stretch">
    <div class="col-lg-6">
      <div class="panel h-100">
        <div class="muted mb-2">Balance <span id="periodLabel">(all time)</span></div>
        <div class="balance" id="balance">₹0</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="panel h-100"><div class="muted mb-1">Income</div><div class="h3 fw-bold in m-0" id="income">₹0</div></div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="panel h-100"><div class="muted mb-1">Expenses</div><div class="h3 fw-bold out m-0" id="expense">₹0</div></div>
    </div>
  </section>

  <section class="panel mb-3">
    <h2 class="h6 fw-bold mb-3">Add a transaction</h2>
    <div class="row g-2" id="form" novalidate>
      <div class="col-md-4"><input id="desc" class="form-control" placeholder="Description" maxlength="60" aria-label="Description"><div class="invalid-feedback">Enter a description.</div></div>
      <div class="col-6 col-md-2"><input id="amount" type="number" min="0.01" step="0.01" class="form-control" placeholder="Amount (₹)" aria-label="Amount"><div class="invalid-feedback">Enter an amount above 0.</div></div>
      <div class="col-6 col-md-2"><select id="type" class="form-select" aria-label="Type"><option value="expense">Expense</option><option value="income">Income</option></select></div>
      <div class="col-6 col-md-2"><select id="category" class="form-select" aria-label="Category"></select></div>
      <div class="col-6 col-md-2"><input id="date" type="date" class="form-control" aria-label="Date"></div>
      <div class="col-12"><button id="addBtn" class="btn btn-main w-100 py-2">Add transaction</button></div>
    </div>
  </section>

  <section class="row g-3">
    <div class="col-lg-5">
      <div class="panel h-100">
        <h2 class="h6 fw-bold mb-3">Where the money went</h2>
        <div class="chart-box"><canvas id="chart"></canvas></div>
        <div class="empty muted d-none" id="chartEmpty">No expenses in this period yet.</div>
      </div>
    </div>
    <div class="col-lg-7">
      <div class="panel h-100">
        <div class="row g-2 mb-2">
          <div class="col-12 col-md-4"><input type="month" id="month" class="form-control" aria-label="Filter by month"></div>
          <div class="col-6 col-md-3"><select id="fType" class="form-select" aria-label="Filter by type"><option value="all">All types</option><option value="income">Income</option><option value="expense">Expense</option></select></div>
          <div class="col-6 col-md-5"><input id="search" class="form-control" placeholder="Search description" aria-label="Search"></div>
        </div>
        <div id="list" aria-live="polite"></div>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const CATS = {
  expense: ["Food","Travel","Shopping","Bills","Health","Other"],
  income: ["Salary","Freelance","Gift","Other"]
};
const COLORS = ["#0f766e","#be123c","#d97706","#4f46e5","#0891b2","#7c3aed"];
const $ = id => document.getElementById(id);
const rupee = n => "₹" + n.toLocaleString("en-IN", {minimumFractionDigits:2, maximumFractionDigits:2});

function load(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
let txs = load("transactions", []);
const save = () => localStorage.setItem("transactions", JSON.stringify(txs));
const today = () => new Date().toISOString().slice(0,10);

/* theme */
function setTheme(t){
  document.documentElement.setAttribute("data-bs-theme", t);
  $("themeBtn").textContent = t === "dark" ? "Light mode" : "Dark mode";
  localStorage.setItem("theme", t);
  if (chart) updateChart(currentExpenses());
}
$("themeBtn").onclick = () => setTheme(document.documentElement.getAttribute("data-bs-theme") === "dark" ? "light" : "dark");

/* category list follows type */
function fillCategories(){
  $("category").innerHTML = "";
  CATS[$("type").value].forEach(c => $("category").add(new Option(c, c)));
}
$("type").onchange = fillCategories;

/* add */
$("addBtn").onclick = () => {
  const desc = $("desc").value.trim();
  const amount = parseFloat($("amount").value);
  const dOk = desc.length > 0, aOk = amount > 0;
  $("desc").classList.toggle("is-invalid", !dOk);
  $("amount").classList.toggle("is-invalid", !aOk);
  if (!dOk || !aOk) return;
  txs.push({ id: Date.now(), desc, amount, type: $("type").value, category: $("category").value, date: $("date").value || today() });
  save();
  $("desc").value = ""; $("amount").value = "";
  render();
  $("desc").focus();
};
["desc","amount"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") $("addBtn").click(); }));

/* delete */
$("list").addEventListener("click", e => {
  const btn = e.target.closest("[data-id]");
  if (!btn) return;
  txs = txs.filter(t => t.id !== Number(btn.dataset.id));
  save(); render();
});

/* filters */
["month","fType","search"].forEach(id => $(id).addEventListener("input", render));

function byMonth(){
  const m = $("month").value;
  return m ? txs.filter(t => t.date.startsWith(m)) : txs;
}
const currentExpenses = () => byMonth().filter(t => t.type === "expense");

/* chart */
let chart = new Chart($("chart"), {
  type: "doughnut",
  data: { labels: [], datasets: [{ data: [], backgroundColor: COLORS, borderWidth: 0 }] },
  options: { maintainAspectRatio: false, cutout: "62%", plugins: { legend: { position: "bottom" } } }
});
function updateChart(expenses){
  const totals = {};
  expenses.forEach(t => totals[t.category] = (totals[t.category] || 0) + t.amount);
  const labels = Object.keys(totals);
  const light = document.documentElement.getAttribute("data-bs-theme") !== "dark";
  chart.options.plugins.legend.labels = { color: light ? "#16241f" : "#e7efea" };
  chart.data.labels = labels;
  chart.data.datasets[0].data = labels.map(l => totals[l]);
  chart.update();
  $("chartEmpty").classList.toggle("d-none", labels.length > 0);
  $("chart").parentElement.classList.toggle("d-none", labels.length === 0);
}

/* render */
function render(){
  const period = byMonth();
  const income = period.filter(t => t.type === "income").reduce((s,t) => s + t.amount, 0);
  const expense = period.filter(t => t.type === "expense").reduce((s,t) => s + t.amount, 0);
  $("balance").textContent = rupee(income - expense);
  $("income").textContent = rupee(income);
  $("expense").textContent = rupee(expense);
  $("periodLabel").textContent = $("month").value ? "(" + new Date($("month").value + "-01").toLocaleDateString("en-IN",{month:"long",year:"numeric"}) + ")" : "(all time)";
  updateChart(period.filter(t => t.type === "expense"));

  const type = $("fType").value, q = $("search").value.trim().toLowerCase();
  const rows = period
    .filter(t => (type === "all" || t.type === type) && t.desc.toLowerCase().includes(q))
    .sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);

  const list = $("list");
  list.innerHTML = "";
  if (!rows.length){
    const e = document.createElement("div");
    e.className = "empty muted";
    e.textContent = txs.length ? "Nothing matches these filters." : "No transactions yet. Add your first one above.";
    list.appendChild(e);
    return;
  }
  rows.forEach(t => {
    const row = document.createElement("div");
    row.className = "tx";
    const bar = document.createElement("span"); bar.className = "bar " + t.type;
    const info = document.createElement("div"); info.className = "info";
    const name = document.createElement("strong"); name.textContent = t.desc;
    const meta = document.createElement("small"); meta.className = "muted";
    meta.textContent = t.category + " · " + new Date(t.date).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
    info.append(name, meta);
    const amt = document.createElement("div");
    amt.className = "fw-bold " + (t.type === "income" ? "in" : "out");
    amt.textContent = (t.type === "income" ? "+" : "−") + rupee(t.amount);
    const del = document.createElement("button");
    del.className = "btn btn-sm btn-outline-danger"; del.textContent = "Delete";
    del.dataset.id = t.id; del.setAttribute("aria-label", "Delete " + t.desc);
    row.append(bar, info, amt, del);
    list.appendChild(row);
  });
}

/* export */
$("exportBtn").onclick = () => {
  if (!txs.length) return alert("Add a transaction before exporting.");
  const esc = v => '"' + String(v).replace(/"/g,'""') + '"';
  const csv = ["Date,Description,Type,Category,Amount"].concat(
    txs.map(t => [t.date, esc(t.desc), t.type, t.category, t.amount].join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = "transactions.csv"; a.click();
  URL.revokeObjectURL(a.href);
};

/* init */
txs = txs.map(t => ({ ...t, desc: t.desc ?? t.description ?? "", date: t.date || today() }));
$("date").value = today();
fillCategories();
setTheme(localStorage.getItem("theme") || "light");
render();
</script>
</body>
</html>
